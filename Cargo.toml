[workspace]
resolver = "2"
members = [
  "crates/terlan",
  "crates/terlan-archive",
  "crates/terlan-build-cache",
  "crates/terlan-foundations-adapter",
  "crates/terlan-process-owner",
  "crates/terl-docs",
  "crates/terlan-runtime-abi",
  "crates/terlan-service-foundation",
  "crates/terlan-storage",
  "crates/terlan-test-orchestrator",
  "std",
  "std/native/libpq/generated/native/rust",
  "std/net/native",
  "std/data/native",
  "std/http/native",
  "std/encoding/native",
  "std/crypto/native",
  "std/time/native",
  "tools/rust_boundary_audit",
]

[workspace.package]
version = "0.0.9"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Terlan contributors"]
repository = "https://github.com/terlan-lang/terlan"

[workspace.dependencies]
instant-acme = "0.7"
mio = "1.2.2"
socket2 = "0.6.1"
percent-encoding = "2.3.2"
axum = { version = "0.8.9", default-features = false }
base64 = "0.22.1"
bytes = "1"
cc = "=1.5.1"
cxx = "=1.0.197"
cxx-build = "=1.0.197"
getrandom = "=0.4.3"
http = "1.3.1"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = { version = "1.11.1", default-features = false }
mime_guess = "2"
pkg-config = "=0.3.33"
polling = "3.11.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rcgen = "0.13"
rustls = { version = "0.23.45", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }
sha2 = "0.11.0"
syn = { version = "3", features = ["full", "visit"] }
tar = "0.4.44"
time = "0.3"
tokio = "1"
tungstenite = "0.29"
url = "2.5.8"
terlan-archive = { path = "crates/terlan-archive" }
terl-docs = { path = "crates/terl-docs" }
terlan-runtime-abi = { path = "crates/terlan-runtime-abi" }
terlan-storage = { path = "crates/terlan-storage" }
tempfile = "3"
terlan-process-owner = { path = "crates/terlan-process-owner" }
terlan-test-orchestrator = { path = "crates/terlan-test-orchestrator" }
terlan-service-foundation = { path = "crates/terlan-service-foundation" }
zstd = "0.14.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Validation hashes complete toolchains and artifacts. Keep SHA-2's compression
# backend optimized in developer/test tools without optimizing the whole compiler
# or removing its line tables. CPU feature selection remains portable.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

# The compiler-free service runtime is distributed independently from compiler
# tooling. Whole-graph optimization keeps its always-resident protocol and VM
# surface within the release text budget without weakening runtime ownership.
[profile.serve-runtime]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
