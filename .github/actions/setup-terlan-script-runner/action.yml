name: Setup Terlan script runner
description: Restore or self-bootstrap the compiler used by Terlan CI scripts

outputs:
  terlc:
    description: Cached compiler path
    value: ${{ steps.paths.outputs.terlc }}
  vm:
    description: Cached VM path
    value: ${{ steps.paths.outputs.vm }}
  classifier-image:
    description: Current compiled change-classification image
    value: ${{ steps.paths.outputs.classifier-image }}
  rust-format-image:
    description: Current compiled Rust-formatting image
    value: ${{ steps.paths.outputs.rust-format-image }}
  terlan-style-image:
    description: Current compiled Terlan-style image
    value: ${{ steps.paths.outputs.terlan-style-image }}

inputs:
  allow-compatible-fallback:
    description: Permit bootstrap-only callers to use an older compatible runner
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve script-runner cache identity
      id: identity
      shell: bash
      run: |
        key="${RUNNER_OS}-${RUNNER_ARCH}-terlan-script-runner-v4-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'std/**/*.terl', 'std/**/*.terli', 'scripts/ci/scripts/ClassifyChanges.terls', 'scripts/ci/src/ci/ChangeClassifier.terl') }}"
        program_key="terlan-ci-programs-v1-$key-${{ hashFiles('scripts/ci/scripts/CheckRustFormatting.terls', 'scripts/ci/scripts/CheckTerlanStyle.terls', 'scripts/ci/src/ci/FormattingTools.terl', 'scripts/ci/src/ci/RustFormatting.terl', 'scripts/ci/src/ci/TerlanStyle.terl') }}"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "program-key=$program_key" >> "$GITHUB_OUTPUT"

    - name: Restore script runner
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/script-runner
        key: ${{ steps.identity.outputs.key }}
        restore-keys: |
          ${{ inputs.allow-compatible-fallback == 'true' && format('{0}-{1}-terlan-script-runner-v4-', runner.os, runner.arch) || '' }}
          ${{ inputs.allow-compatible-fallback == 'true' && format('{0}-{1}-terlan-script-runner-v3-', runner.os, runner.arch) || '' }}

    - name: Validate restored script runner
      id: restored
      shell: bash
      run: |
        usable=false
        if test -x target/script-runner/terlc \
          && test -x target/script-runner/terlan-vm \
          && target/script-runner/terlc version >/dev/null 2>&1; then
          usable=true
        fi
        echo "usable=$usable" >> "$GITHUB_OUTPUT"

    - name: Install Rust for self-bootstrap
      if: ${{ steps.restored.outputs.usable != 'true' }}
      uses: ./.github/actions/setup-rust
      with:
        components: ""
        cache-build: "true"
        cache-scope: script-runner
        cache-profile: compiler-bootstrap

    - name: Build candidate script runner
      if: ${{ steps.restored.outputs.usable != 'true' }}
      shell: bash
      run: |
        cargo build --locked -p terlan --bin terlc --bin terlan-vm
        install -D -m 0755 target/debug/terlc target/script-runner/terlc
        install -D -m 0755 target/debug/terlan-vm target/script-runner/terlan-vm

    - name: Compile current change classifier
      if: ${{ steps.restore.outputs.cache-hit != 'true' || steps.restored.outputs.usable != 'true' }}
      shell: bash
      run: |
        target/script-runner/terlc build \
          scripts/ci/scripts/ClassifyChanges.terls \
          --target terlan-vm \
          --out-dir target/script-runner/classifier
        test -s target/script-runner/classifier/vm/scripts_ClassifyChanges.tvm

    - name: Validate compiled change classifier
      shell: bash
      run: |
        output=$(mktemp)
        revision=$(git rev-parse HEAD)
        target/script-runner/terlan-vm run \
          target/script-runner/classifier/vm/scripts_ClassifyChanges.tvm \
          --script-eval -- "$revision" "$revision" "$output" >/dev/null
        grep -qx 'changed-count=0' "$output"
        rm -f "$output"

    - name: Compact candidate script runner
      shell: bash
      run: |
        strip --strip-unneeded target/script-runner/terlc target/script-runner/terlan-vm
        test "$(wc -c < target/script-runner/terlc)" -le 157286400
        test "$(wc -c < target/script-runner/terlan-vm)" -le 125829120

    - name: Save candidate script runner
      # A compatible fallback is never saved under the exact candidate key.
      if: ${{ steps.restored.outputs.usable != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/script-runner
        key: ${{ steps.identity.outputs.key }}

    - name: Restore compiled CI programs
      id: ci-programs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/ci-programs
        key: ${{ steps.identity.outputs.program-key }}

    - name: Compile current CI programs
      if: ${{ steps.ci-programs.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        target/script-runner/terlc build \
          scripts/ci/scripts/CheckRustFormatting.terls \
          --target terlan-vm \
          --out-dir target/ci-programs/rust-format
        target/script-runner/terlc build \
          scripts/ci/scripts/CheckTerlanStyle.terls \
          --target terlan-vm \
          --out-dir target/ci-programs/terlan-style

    - name: Validate compiled CI programs
      shell: bash
      run: |
        test -s target/ci-programs/rust-format/vm/scripts_CheckRustFormatting.tvm
        test -s target/ci-programs/terlan-style/vm/scripts_CheckTerlanStyle.tvm

    - name: Save compiled CI programs
      if: ${{ steps.ci-programs.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/ci-programs
        key: ${{ steps.identity.outputs.program-key }}

    - name: Validate script runner
      id: paths
      shell: bash
      run: |
        test -x target/script-runner/terlc
        test -x target/script-runner/terlan-vm
        test -s target/script-runner/classifier/vm/scripts_ClassifyChanges.tvm
        echo "terlc=$GITHUB_WORKSPACE/target/script-runner/terlc" >> "$GITHUB_OUTPUT"
        echo "vm=$GITHUB_WORKSPACE/target/script-runner/terlan-vm" >> "$GITHUB_OUTPUT"
        echo "classifier-image=$GITHUB_WORKSPACE/target/script-runner/classifier/vm/scripts_ClassifyChanges.tvm" >> "$GITHUB_OUTPUT"
        echo "rust-format-image=$GITHUB_WORKSPACE/target/ci-programs/rust-format/vm/scripts_CheckRustFormatting.tvm" >> "$GITHUB_OUTPUT"
        echo "terlan-style-image=$GITHUB_WORKSPACE/target/ci-programs/terlan-style/vm/scripts_CheckTerlanStyle.tvm" >> "$GITHUB_OUTPUT"
