name: Setup Terlan script runner
description: Restore or self-bootstrap the compiler used by Terlan CI scripts

outputs:
  terlc:
    description: Cached compiler path
    value: ${{ steps.paths.outputs.terlc }}
  vm:
    description: Cached VM path
    value: ${{ steps.paths.outputs.vm }}

inputs:
  allow-compatible-fallback:
    description: Permit bootstrap-only callers to use an older compatible runner
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve script-runner cache identity
      id: identity
      shell: bash
      run: |
        key="${RUNNER_OS}-${RUNNER_ARCH}-terlan-script-runner-v3-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs', 'std/**/*.terl', 'std/**/*.terli') }}"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore script runner
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/script-runner
        key: ${{ steps.identity.outputs.key }}
        restore-keys: |
          ${{ inputs.allow-compatible-fallback == 'true' && format('{0}-{1}-terlan-script-runner-v3-', runner.os, runner.arch) || '' }}
          ${{ inputs.allow-compatible-fallback == 'true' && format('{0}-{1}-terlan-script-runner-v2-', runner.os, runner.arch) || '' }}

    - name: Validate restored script runner
      id: restored
      shell: bash
      run: |
        usable=false
        if test -x target/script-runner/terlc && test -x target/script-runner/terlan-vm; then
          output=$(mktemp)
          revision=$(git rev-parse HEAD)
          if target/script-runner/terlc run scripts/ci/scripts/ClassifyChanges.terls -- \
            "$revision" "$revision" "$output" >/dev/null 2>&1; then
            usable=true
          fi
          rm -f "$output"
        fi
        echo "usable=$usable" >> "$GITHUB_OUTPUT"

    - name: Install Rust for self-bootstrap
      if: ${{ steps.restored.outputs.usable != 'true' }}
      uses: ./.github/actions/setup-rust
      with:
        components: ""
        cache-build: "true"
        cache-scope: script-runner
        cache-profile: compiler-bootstrap

    - name: Build candidate script runner
      if: ${{ steps.restored.outputs.usable != 'true' }}
      shell: bash
      run: |
        cargo build --locked -p terlan --bin terlc --bin terlan-vm
        install -D -m 0755 target/debug/terlc target/script-runner/terlc
        install -D -m 0755 target/debug/terlan-vm target/script-runner/terlan-vm

    - name: Compact candidate script runner
      shell: bash
      run: |
        strip --strip-unneeded target/script-runner/terlc target/script-runner/terlan-vm
        test "$(wc -c < target/script-runner/terlc)" -le 157286400
        test "$(wc -c < target/script-runner/terlan-vm)" -le 125829120

    - name: Save candidate script runner
      # A compatible fallback is never saved under the exact candidate key.
      if: ${{ steps.restored.outputs.usable != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/script-runner
        key: ${{ steps.identity.outputs.key }}

    - name: Validate script runner
      id: paths
      shell: bash
      run: |
        test -x target/script-runner/terlc
        test -x target/script-runner/terlan-vm
        echo "terlc=$GITHUB_WORKSPACE/target/script-runner/terlc" >> "$GITHUB_OUTPUT"
        echo "vm=$GITHUB_WORKSPACE/target/script-runner/terlan-vm" >> "$GITHUB_OUTPUT"
