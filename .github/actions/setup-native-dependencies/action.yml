name: Set up native build dependencies
description: Install the target-native tools and libpq payload used by AOT validation.

inputs:
  target:
    description: Terlan release platform identifier.
    required: true
  lean:
    description: Also install the Linux Lean toolchain manager.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux native dependencies
      if: startsWith(inputs.target, 'linux-')
      shell: bash
      env:
        TERLAN_INSTALL_LEAN: ${{ inputs.lean }}
      run: |
        packages=(bubblewrap libpq-dev pkg-config ripgrep)
        if [[ "$TERLAN_INSTALL_LEAN" == true ]]; then
          packages+=(elan)
        fi
        sudo apt-get update
        sudo apt-get install --yes "${packages[@]}"
        # Hosted Ubuntu 24.04 requires this for the actual fail-closed sandbox,
        # both at the validation-tool bootstrap and capability-worker boundary.
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Install macOS native dependencies
      if: startsWith(inputs.target, 'macos-')
      shell: bash
      run: |
        brew install libpq pkg-config
        echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
        echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"

    - name: Install Windows native dependencies
      if: startsWith(inputs.target, 'windows-')
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"
        $triplet = if ("${{ inputs.target }}" -eq "windows-aarch64") {
          "arm64-windows"
        } else {
          "x64-windows"
        }

        choco install make --yes --no-progress
        if ($LASTEXITCODE -ne 0) {
          throw "Chocolatey failed to install make with exit code $LASTEXITCODE"
        }

        $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
        $downloads = Join-Path $env:VCPKG_INSTALLATION_ROOT "downloads"
        $flexName = "win_flex_bison-2.5.24.zip"
        $flexArchive = Join-Path $downloads $flexName
        $flexPartial = "$flexArchive.partial"
        $flexSha512 = "dc89fcdaa7071fbbf88b0755b799d69223240c28736924b4c30968c08e7e0b116c7e05ae98a9257be26a1dfb4aa70a628808a6b6018706bf857555c5b4335018"

        if (Test-Path -PathType Leaf $flexArchive) {
          $actualSha512 = (Get-FileHash -Algorithm SHA512 $flexArchive).Hash.ToLowerInvariant()
          if ($actualSha512 -ne $flexSha512) {
            Remove-Item -Path $flexArchive -Force
          }
        }
        if (-not (Test-Path -PathType Leaf $flexArchive)) {
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $downloadHeaders = $headers.Clone()
          $downloadHeaders.Accept = "application/octet-stream"
          $delaySeconds = 5
          $prefetchAttempts = 4
          for ($attempt = 1; $attempt -le $prefetchAttempts; $attempt += 1) {
            try {
              $release = Invoke-RestMethod `
                -Headers $headers `
                -Uri "https://api.github.com/repos/lexxmark/winflexbison/releases/tags/v2.5.24"
              $asset = $release.assets | Where-Object { $_.name -eq $flexName } | Select-Object -First 1
              if ($null -eq $asset) {
                throw "release asset $flexName is absent"
              }
              New-Item -ItemType Directory -Path $downloads -Force | Out-Null
              Invoke-WebRequest -Headers $downloadHeaders -Uri $asset.url -OutFile $flexPartial
              $actualSha512 = (Get-FileHash -Algorithm SHA512 $flexPartial).Hash.ToLowerInvariant()
              if ($actualSha512 -ne $flexSha512) {
                throw "release asset $flexName failed its pinned SHA-512 check"
              }
              Move-Item -Path $flexPartial -Destination $flexArchive -Force
              break
            } catch {
              Remove-Item -Path $flexPartial -Force -ErrorAction SilentlyContinue
              if ($attempt -eq $prefetchAttempts) {
                Write-Warning "authenticated $flexName prefetch failed after $prefetchAttempts attempts; vcpkg will use its verified downloader"
                break
              }
              Write-Warning "authenticated $flexName prefetch attempt $attempt failed; retrying in $delaySeconds seconds"
              Start-Sleep -Seconds $delaySeconds
              $delaySeconds *= 2
            }
          }
        }

        $delaySeconds = 20
        $installAttempts = 4
        for ($attempt = 1; $attempt -le $installAttempts; $attempt += 1) {
          & $vcpkg install "libpq:$triplet" "pkgconf:$triplet"
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            break
          }
          if ($attempt -eq $installAttempts) {
            throw "vcpkg failed to install native dependencies for $triplet after $installAttempts attempts; final exit code $exitCode"
          }
          Write-Warning "vcpkg install attempt $attempt failed for $triplet; retrying in $delaySeconds seconds"
          Start-Sleep -Seconds $delaySeconds
          $delaySeconds *= 2
        }

        $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
        $installedBin = Join-Path $installed "bin"
        $pkgConfig = Join-Path $installed "tools\pkgconf\pkgconf.exe"
        if (-not (Test-Path -PathType Leaf $pkgConfig)) {
          throw "vcpkg did not install pkgconf at $pkgConfig"
        }
        & $pkgConfig --version
        if ($LASTEXITCODE -ne 0) {
          throw "pkgconf smoke check failed with exit code $LASTEXITCODE"
        }

        $installedBin |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "PKG_CONFIG=$pkgConfig" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
