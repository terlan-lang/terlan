name: Set up pinned Rust
description: Install the requested Rust toolchain and cache immutable Cargo inputs.

outputs:
  compiled-cache-hit:
    description: Whether the exact compiled Cargo cache key was restored.
    value: ${{ steps.compiled-rust-cache.outputs.cache-hit }}
  compiled-cache-key:
    description: Exact key used for the compiled Cargo cache.
    value: ${{ steps.compiled-cache-key.outputs.value }}

inputs:
  toolchain:
    description: Exact Rust toolchain version.
    required: false
    default: 1.96.0
  targets:
    description: Comma-separated rustup targets.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components required by the workflow.
    required: false
    default: rustfmt,clippy
  cache-build:
    description: Restore and retain compiled Cargo dependencies for long validation jobs.
    required: false
    default: "false"
  cache-registry:
    description: Restore Cargo registry inputs for jobs that execute Cargo.
    required: false
    default: "true"
  cache-scope:
    description: Runner image or ABI label for compiled Cargo artifacts.
    required: false
    default: ""
  cache-profile:
    description: Compatible build profile shared by sequential jobs.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Validate compiled cache scope
      if: inputs.cache-build == 'true'
      id: compiled-cache-scope
      shell: bash
      env:
        TERLAN_RUST_CACHE_SCOPE: ${{ inputs.cache-scope }}
      run: |
        if [[ -z "$TERLAN_RUST_CACHE_SCOPE" ]]; then
          echo "cache-scope is required when cache-build is true" >&2
          exit 1
        fi
        if [[ ! "$TERLAN_RUST_CACHE_SCOPE" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "cache-scope must be a runner image or ABI label" >&2
          exit 1
        fi
        case "$RUNNER_OS" in
          Linux)
            runtime_abi=$(getconf GNU_LIBC_VERSION | tr ' ' '-')
            ;;
          macOS)
            runtime_abi="macos-$(sw_vers -productVersion | cut -d. -f1)"
            ;;
          Windows)
            runtime_abi="${ImageOS:-windows}"
            ;;
          *)
            echo "unsupported runner OS for compiled cache: $RUNNER_OS" >&2
            exit 1
            ;;
        esac
        if [[ ! "$runtime_abi" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "resolved runtime ABI is unsafe for a cache key" >&2
          exit 1
        fi
        printf 'value=%s-%s\n' "$TERLAN_RUST_CACHE_SCOPE" "$runtime_abi" >> "$GITHUB_OUTPUT"

    - name: Resolve compiled cache key
      if: inputs.cache-build == 'true'
      id: compiled-cache-key
      shell: bash
      env:
        TERLAN_CACHE_SCOPE: ${{ steps.compiled-cache-scope.outputs.value }}
        TERLAN_CACHE_TOOLCHAIN: ${{ inputs.toolchain }}
        TERLAN_CACHE_PROFILE: ${{ inputs.cache-profile }}
        TERLAN_CACHE_MANIFEST: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      run: |
        if [[ ! "$TERLAN_CACHE_PROFILE" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "cache-profile must be a stable compatibility label" >&2
          exit 1
        fi
        printf 'value=terlan-rust-dependencies-v1-%s-%s-%s-%s-%s-%s\n' \
          "$TERLAN_CACHE_SCOPE" "$RUNNER_OS" "$RUNNER_ARCH" \
          "$TERLAN_CACHE_TOOLCHAIN" "$TERLAN_CACHE_PROFILE" "$TERLAN_CACHE_MANIFEST" >> "$GITHUB_OUTPUT"

    - name: Cache Cargo registry inputs
      if: inputs.cache-registry == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: terlan-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          terlan-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache compiled Rust dependencies
      if: inputs.cache-build == 'true'
      id: compiled-rust-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/debug/.fingerprint
          !target/debug/.fingerprint/terlan-*
          !target/debug/.fingerprint/terl-docs-*
          target/debug/build
          !target/debug/build/terlan-*
          !target/debug/build/terl-docs-*
          target/debug/deps
          !target/debug/deps/terlan*
          !target/debug/deps/libterlan*
          !target/debug/deps/terl_docs*
          !target/debug/deps/libterl_docs*
          !target/debug/deps/abi1_evidence_producers*
          !target/debug/deps/direct_aot*
          !target/debug/deps/managed_continuation_aot*
          !target/debug/deps/tvm_transition_rejection*
          !target/debug/deps/vm_supervision_runtime*
          !target/debug/deps/bootstrap_admission*
          !target/debug/deps/support_bootstrap_make*
          !target/debug/deps/cargo_metadata_make*
          !target/debug/deps/command_dispatch*
          !target/debug/deps/compiler_bootstrap_make*
          !target/debug/deps/driver_snapshot*
          !target/debug/deps/generated_artifacts_make*
          !target/debug/deps/hosted_release_make*
          !target/debug/deps/library_selection*
          !target/debug/deps/make_coverage*
          !target/debug/deps/owned_command*
          !target/debug/deps/preparation_lease*
          !target/debug/deps/proof_*
          !target/debug/deps/publish_*
          !target/debug/deps/refresh_plan_make*
          !target/debug/deps/typed_validator_owner*
          target/release/.fingerprint
          !target/release/.fingerprint/terlan-*
          !target/release/.fingerprint/terl-docs-*
          target/release/build
          !target/release/build/terlan-*
          !target/release/build/terl-docs-*
          target/release/deps
          !target/release/deps/terlan*
          !target/release/deps/libterlan*
          !target/release/deps/terl_docs*
          !target/release/deps/libterl_docs*
        key: ${{ steps.compiled-cache-key.outputs.value }}
        restore-keys: |
          terlan-rust-dependencies-v1-${{ steps.compiled-cache-scope.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-profile }}-

    - name: Install exact Rust toolchain
      shell: bash
      env:
        TERLAN_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        TERLAN_RUST_TARGETS: ${{ inputs.targets }}
        TERLAN_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        arguments=(toolchain install "$TERLAN_RUST_TOOLCHAIN" --profile minimal)
        if [[ -n "$TERLAN_RUST_TARGETS" ]]; then
          arguments+=(--target "$TERLAN_RUST_TARGETS")
        fi
        if [[ -n "$TERLAN_RUST_COMPONENTS" ]]; then
          arguments+=(--component "$TERLAN_RUST_COMPONENTS")
        fi
        rustup "${arguments[@]}"
