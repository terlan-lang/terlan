name: Set up pinned Rust
description: Install the requested Rust toolchain and cache immutable Cargo inputs.

inputs:
  toolchain:
    description: Exact Rust toolchain version.
    required: false
    default: 1.96.0
  targets:
    description: Comma-separated rustup targets.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components required by the workflow.
    required: false
    default: rustfmt,clippy
  cache-build:
    description: Restore and retain compiled Cargo dependencies for long validation jobs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Cargo registry inputs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: terlan-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          terlan-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache compiled Rust dependencies
      if: inputs.cache-build == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
          target/release/.fingerprint
          target/release/build
          target/release/deps
        key: terlan-rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}-${{ github.sha }}-${{ github.job }}
        restore-keys: |
          terlan-rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}-${{ github.sha }}-
          terlan-rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}-
          terlan-rust-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-

    - name: Install exact Rust toolchain
      shell: bash
      env:
        TERLAN_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        TERLAN_RUST_TARGETS: ${{ inputs.targets }}
        TERLAN_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        arguments=(toolchain install "$TERLAN_RUST_TOOLCHAIN" --profile minimal)
        if [[ -n "$TERLAN_RUST_TARGETS" ]]; then
          arguments+=(--target "$TERLAN_RUST_TARGETS")
        fi
        if [[ -n "$TERLAN_RUST_COMPONENTS" ]]; then
          arguments+=(--component "$TERLAN_RUST_COMPONENTS")
        fi
        rustup "${arguments[@]}"
