name: Set up pinned Rust
description: Install the requested Rust toolchain and cache immutable Cargo inputs.

outputs:
  compiled-cache-hit:
    description: Whether the exact compiled Cargo cache key was restored.
    value: ${{ steps.compiled-rust-cache.outputs.cache-hit }}
  compiled-cache-key:
    description: Exact key used for the compiled Cargo cache.
    value: ${{ steps.compiled-cache-key.outputs.value }}

inputs:
  toolchain:
    description: Exact Rust toolchain version.
    required: false
    default: 1.96.0
  targets:
    description: Comma-separated rustup targets.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components required by the workflow.
    required: false
    default: rustfmt,clippy
  cache-build:
    description: Restore and retain compiled Cargo dependencies for long validation jobs.
    required: false
    default: "false"
  cache-scope:
    description: Runner image or ABI label for compiled Cargo artifacts.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate compiled cache scope
      if: inputs.cache-build == 'true'
      id: compiled-cache-scope
      shell: bash
      env:
        TERLAN_RUST_CACHE_SCOPE: ${{ inputs.cache-scope }}
      run: |
        if [[ -z "$TERLAN_RUST_CACHE_SCOPE" ]]; then
          echo "cache-scope is required when cache-build is true" >&2
          exit 1
        fi
        if [[ ! "$TERLAN_RUST_CACHE_SCOPE" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "cache-scope must be a runner image or ABI label" >&2
          exit 1
        fi
        case "$RUNNER_OS" in
          Linux)
            runtime_abi=$(getconf GNU_LIBC_VERSION | tr ' ' '-')
            ;;
          macOS)
            runtime_abi="macos-$(sw_vers -productVersion | cut -d. -f1)"
            ;;
          Windows)
            runtime_abi="${ImageOS:-windows}"
            ;;
          *)
            echo "unsupported runner OS for compiled cache: $RUNNER_OS" >&2
            exit 1
            ;;
        esac
        if [[ ! "$runtime_abi" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "resolved runtime ABI is unsafe for a cache key" >&2
          exit 1
        fi
        printf 'value=%s-%s\n' "$TERLAN_RUST_CACHE_SCOPE" "$runtime_abi" >> "$GITHUB_OUTPUT"

    - name: Resolve compiled cache key
      if: inputs.cache-build == 'true'
      id: compiled-cache-key
      shell: bash
      env:
        TERLAN_CACHE_SCOPE: ${{ steps.compiled-cache-scope.outputs.value }}
        TERLAN_CACHE_TOOLCHAIN: ${{ inputs.toolchain }}
        TERLAN_CACHE_MANIFEST: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
      run: |
        printf 'value=terlan-rust-build-v2-%s-%s-%s-%s-%s-%s-%s\n' \
          "$TERLAN_CACHE_SCOPE" "$RUNNER_OS" "$RUNNER_ARCH" \
          "$TERLAN_CACHE_TOOLCHAIN" "$GITHUB_JOB" "$TERLAN_CACHE_MANIFEST" \
          "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

    - name: Cache Cargo registry inputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: terlan-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          terlan-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache compiled Rust dependencies
      if: inputs.cache-build == 'true'
      id: compiled-rust-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/debug/.fingerprint
          target/debug/build
          target/debug/deps
          target/release/.fingerprint
          target/release/build
          target/release/deps
        key: ${{ steps.compiled-cache-key.outputs.value }}
        restore-keys: |
          terlan-rust-build-v2-${{ steps.compiled-cache-scope.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}-
          terlan-rust-build-v2-${{ steps.compiled-cache-scope.outputs.value }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ github.job }}-

    - name: Install exact Rust toolchain
      shell: bash
      env:
        TERLAN_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        TERLAN_RUST_TARGETS: ${{ inputs.targets }}
        TERLAN_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        arguments=(toolchain install "$TERLAN_RUST_TOOLCHAIN" --profile minimal)
        if [[ -n "$TERLAN_RUST_TARGETS" ]]; then
          arguments+=(--target "$TERLAN_RUST_TARGETS")
        fi
        if [[ -n "$TERLAN_RUST_COMPONENTS" ]]; then
          arguments+=(--component "$TERLAN_RUST_COMPONENTS")
        fi
        rustup "${arguments[@]}"
