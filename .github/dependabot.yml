version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Blocked release lines exceed the duplicate-family budget of 34.
    # Revisit after the coordinated migrations in PR_UPGRADE_DEFERRALS.md.
    ignore:
      - dependency-name: base64
        versions: [">=0.23, <0.24"]
      - dependency-name: instant-acme
        versions: [">=0.8, <0.9"]
      - dependency-name: html5ever
        versions: [">=0.40, <0.41"]
      - dependency-name: ammonia
        versions: [">=4.2, <4.3"]
      - dependency-name: cssparser
        versions: [">=0.38, <0.39"]
      - dependency-name: tungstenite
        versions: [">=0.30, <0.31"]
      - dependency-name: rand
        versions: [">=0.10, <0.11"]
      - dependency-name: rcgen
        versions: [">=0.14, <0.15"]
      - dependency-name: signal-hook
        versions: [">=0.4, <0.5"]
      - dependency-name: ureq
        versions: [">=3.3, <3.5"]
      # Oxc non-patch releases require a coordinated frontend migration for 0.0.9.
      - dependency-name: "oxc_*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cranelift:
        patterns:
          - "cranelift-*"
      oxc-frontend:
        patterns:
          - "oxc_*"
      wasm-tools:
        patterns:
          - "wasm-encoder"
          - "wasmparser"
