version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 0.23.1 adds a 35th duplicate family; the release budget is 34.
    # Revisit after transitive Base64 consumers migrate or duplicates are reduced.
    ignore:
      - dependency-name: base64
        versions: ["0.23.1"]
      # These upgrades exceed the duplicate-family budget; see PR_UPGRADE_DEFERRALS.md.
      - dependency-name: instant-acme
        versions: ["0.8.5"]
      - dependency-name: html5ever
        versions: ["0.40.1"]
    groups:
      cranelift:
        patterns:
          - "cranelift-*"
      wasm-tools:
        patterns:
          - "wasm-encoder"
          - "wasmparser"
