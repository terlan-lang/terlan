version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Blocked release lines exceed the duplicate-family budget of 34.
    # Revisit after the coordinated migrations in PR_UPGRADE_DEFERRALS.md.
    ignore:
      - dependency-name: base64
        versions: [">=0.23, <0.24"]
      - dependency-name: instant-acme
        versions: [">=0.8, <0.9"]
      - dependency-name: html5ever
        versions: [">=0.40, <0.41"]
      - dependency-name: ammonia
        versions: [">=4.2, <4.3"]
    groups:
      cranelift:
        patterns:
          - "cranelift-*"
      wasm-tools:
        patterns:
          - "wasm-encoder"
          - "wasmparser"
