name: Deploy terlan.io

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/terl-docs/**"
      - "crates/terlan/Cargo.toml"
      - "crates/terlan/src/commands/build/web_toolchain.rs"
      - "crates/terlan/src/commands/static_site/**"
      - "crates/terlan/src/html/**"
      - "crates/terlan/src/lib.rs"
      - "sites/terlan.io/**"
      - "tools/web-toolchain/package.json"
      - "tools/web-toolchain/package-lock.json"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: terlan-io-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/web-toolchain/package-lock.json
            sites/terlan.io/package-lock.json

      - name: Install compiler-managed web toolchain
        run: npm ci --prefix tools/web-toolchain

      - name: Build Terlan compiler
        run: cargo build --locked -p terlan --bin terlc

      - name: Build and validate terlan.io
        run: |
          TERLC=target/debug/terlc crates/terl-docs/scripts/check-search-policy.sh
          target/debug/terlc test crates/terl-docs/terlan --target terlan-vm
          target/debug/terlc static check \
            sites/terlan.io/src/terlan_io/Site.terl \
            --out-dir sites/terlan.io/public \
            --docs \
            --as-of 2026-08-16 \
            --base-path /

      - name: Restore pinned Playwright browser payload
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: terlan-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sites/terlan.io/package-lock.json') }}
          restore-keys: |
            terlan-playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install browser test dependencies
        working-directory: sites/terlan.io
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test terlan.io in Chromium
        working-directory: sites/terlan.io
        run: npm test

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sites/terlan.io/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
