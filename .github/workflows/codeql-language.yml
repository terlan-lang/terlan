name: CodeQL language analysis

on:
  workflow_call:
    inputs:
      language:
        description: Maintained CodeQL language to analyze
        required: true
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate language
        env:
          CODEQL_LANGUAGE: ${{ inputs.language }}
        run: '[[ "$CODEQL_LANGUAGE" == actions || "$CODEQL_LANGUAGE" == rust ]]'

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          build-mode: none
          languages: ${{ inputs.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ inputs.language }}
