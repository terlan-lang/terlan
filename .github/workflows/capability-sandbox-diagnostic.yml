name: Capability sandbox diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-bubblewrap:
    name: Linux bubblewrap capability worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libpq-dev pkg-config
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user-try --unshare-pid --ro-bind / / -- /bin/true

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Build the real capability worker
        run: cargo build --locked -p terlan --bin terlan-native-worker

      - name: Exercise the production sandbox command
        run: |
          TERLAN_TEST_CAPABILITY_WORKER="$PWD/target/debug/terlan-native-worker" \
            cargo test --locked -p terlan --lib \
              runtime::vm::capability_worker::capability_worker_test::capability_worker_process_transport_runs_full_cycle \
              -- --ignored --exact --nocapture
