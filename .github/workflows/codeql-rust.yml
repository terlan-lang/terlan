name: CodeQL Rust

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "**/Cargo.toml"
      - "**/*.rs"
      - ".github/workflows/codeql-language.yml"
      - ".github/workflows/codeql-rust.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "**/Cargo.toml"
      - "**/*.rs"
      - ".github/workflows/codeql-language.yml"
      - ".github/workflows/codeql-rust.yml"
  schedule:
    - cron: "41 3 * * 4"

permissions:
  contents: read

concurrency:
  group: codeql-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-language.yml
    with:
      language: rust
