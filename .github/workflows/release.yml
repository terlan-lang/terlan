name: Release validation

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact commit expected at the selected ref
        required: true
        type: string
      compiler_run_id:
        description: Successful Compiler CI run for the exact commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revision:
    name: Require exact release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Match dispatched revision
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
      - name: Reuse exact Compiler CI evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPILER_RUN_ID: ${{ inputs.compiler_run_id }}
        with:
          script: |
            const rawRunId = process.env.COMPILER_RUN_ID;
            const runId = Number(rawRunId);
            if (!/^[1-9][0-9]*$/.test(rawRunId) || !Number.isSafeInteger(runId)) {
              throw new Error("compiler_run_id must be a positive integer");
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const validEvent = run.event === "push" || run.event === "workflow_dispatch";
            if (
              run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              run.path !== ".github/workflows/ci.yml" ||
              run.name !== "Compiler CI" ||
              run.head_sha !== context.sha ||
              run.head_branch !== "main" ||
              !validEvent ||
              run.status !== "completed" ||
              run.conclusion !== "success" ||
              run.run_attempt < 1
            ) {
              throw new Error("compiler_run_id is not successful exact-revision Compiler CI evidence");
            }
      - name: Publish workflow run identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "release-validation/run",
              description: `run ${context.runId}, attempt ${context.runAttempt}`,
              target_url: targetUrl,
            });

  dependency-audit:
    name: release locked dependency security audit
    runs-on: ubuntu-24.04
    needs: revision
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Audit locked dependencies
        uses: ./.github/actions/security-audit

  platform:
    name: release AOT (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: revision
    timeout-minutes: ${{ matrix.target == 'macos-x86_64' && 150 || 90 }}
    # LLVM's optimized Terlan codegen can exhaust rustc's default worker stack
    # on the Intel macOS runner. Keep one explicit envelope for validation and
    # the subsequent archive build so they exercise the same compiler setup.
    env:
      RUST_MIN_STACK: "33554432"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            archive: terlc-linux-x86_64.tar.gz
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            archive: terlc-linux-aarch64.tar.gz
          - target: macos-x86_64
            runner: macos-15-intel
            archive: terlc-macos-x86_64.tar.gz
          - target: macos-aarch64
            runner: macos-15
            archive: terlc-macos-aarch64.tar.gz
          - target: windows-x86_64
            runner: windows-2025
            archive: terlc-windows-x86_64.zip
          - target: windows-aarch64
            runner: windows-11-arm
            archive: terlc-windows-aarch64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install target-native dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: ${{ matrix.target }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-build: "true"
          cache-scope: ${{ matrix.runner }}
          cache-profile: native-platform

      - name: Validate macOS process ownership
        if: runner.os == 'macOS'
        run: cargo test --locked -p terlan-process-owner

      - name: Validate target-native AOT consumers
        run: make tvm-aot-platform-target-check
        env:
          TERLAN_MATRIX_TARGET: ${{ matrix.target }}

      # The target validator has already built, packaged, smoked, and installer-
      # smoked this exact archive. Rebuilding it here duplicated the release
      # cycle and could exhaust slower hosted runners after all checks passed.
      - name: Require validated native release archive
        shell: bash
        run: |
          test -s "dist/${{ matrix.archive }}"
          test -s "dist/${{ matrix.archive }}.sha256"

      - name: Upload native release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distribution-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload target execution attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tvm-aot-platform-${{ matrix.target }}
          path: target/quality/tvm-aot-platform/${{ matrix.target }}.json
          if-no-files-found: error

  thread-sanitizer:
    name: release AOT ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: revision
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install release utilities
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64

      - name: Install workspace Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-build: "true"
          cache-scope: ubuntu-24.04
          cache-profile: aot-thread-sanitizer

      - name: Install pinned Rust ThreadSanitizer toolchain
        run: rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src

      - name: Validate thread-neutral AOT runtime
        run: make tvm-aot-thread-sanitizer-check

      - name: Upload ThreadSanitizer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tvm-aot-thread-sanitizer
          path: target/quality/tvm-aot-thread-sanitizer-report.json
          if-no-files-found: error
          retention-days: 90

  multicore-thread-sanitizer:
    name: release VM multicore ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: revision
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install release utilities
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64

      - name: Install pinned Rust ThreadSanitizer target
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnutsan
          components: ""
          cache-build: "true"
          cache-scope: ubuntu-24.04
          cache-profile: vm-thread-sanitizer

      - name: Validate multicore VM memory safety
        run: make vm-multicore-thread-sanitizer-check

      - name: Upload multicore ThreadSanitizer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vm-multicore-thread-sanitizer
          path: |
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
          if-no-files-found: error
          retention-days: 90

  validate:
    name: validate release
    runs-on: ubuntu-24.04
    needs:
      - dependency-audit
      - platform
      - thread-sanitizer
      - multicore-thread-sanitizer
    timeout-minutes: 180
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install release utilities
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-build: "true"
          cache-scope: ubuntu-24.04
          cache-profile: compiler-validation

      - name: Download target execution attestations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A failed final-job retry may already have uploaded the matrix
          # artifact. Admit target reports only, never that aggregate output.
          pattern: release-tvm-aot-platform-*-*
          path: target/quality/tvm-aot-platform-input
          merge-multiple: true

      - name: Download ThreadSanitizer evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tvm-aot-thread-sanitizer
          path: target/quality

      - name: Download hosted multicore ThreadSanitizer evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vm-multicore-thread-sanitizer
          path: target/quality

      - name: Download native release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-distribution-*
          path: target/release-distribution
          merge-multiple: true

      # Matrix aggregation and artifact/contract checks share one compiler and
      # validator bootstrap; Make executes their common prerequisites once.
      - name: Validate the complete hosted release
        run: make release-hosted-validation-check RELEASE_ARTIFACT_SET_ROOT=target/release-distribution
        env:
          TERLAN_TVM_PLATFORM_REPORT_ROOT: target/quality/tvm-aot-platform-input

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tvm-aot-platform-matrix
          path: target/quality/tvm-aot-platform-matrix-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload hosted release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hosted-validation-evidence
          path: |
            target/quality/tvm-aot-platform-matrix-report.json
            target/quality/tvm-aot-thread-sanitizer-report.json
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
            target/quality/vm-multicore-memory-model.json
            target/quality/vm-multicore-release-closeout.json
            target/quality/tvm-aot-platform-matrix-verifier.tvm
            target/quality/tvm-aot-platform-matrix-verifier.tvm.inputs.sha256
            target/quality/tvm-aot-platform-matrix-verifier.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Attest the validated native distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-distribution/*

      - name: Upload validated release distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distribution
          path: target/release-distribution
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-failure-${{ github.run_id }}
          path: target/quality
          if-no-files-found: ignore

  prepare-publication:
    name: prepare sealed publication bundle
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 360
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TERLAN_CURRENT_RELEASE_RUN_ID: ${{ github.run_id }}
      TERLAN_PUBLICATION_INPUT_TIMEOUT_SECONDS: "7200"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install publication dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64
          lean: "true"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-build: "true"
          cache-scope: ubuntu-24.04
          cache-profile: compiler-validation

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install JDK for editor packaging
        run: |
          sudo apt-get install --yes openjdk-21-jdk
          echo 'JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$GITHUB_ENV"
          echo '/usr/lib/jvm/java-21-openjdk-amd64/bin' >> "$GITHUB_PATH"

      - name: Prepare every publication input
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          make publish-prepare VERSION="$version"
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Seal publication bundle
        shell: bash
        run: |
          TERLAN_RELEASE_ROOT="$PWD" \
            target/debug/terlan-vm run \
              target/self-validation/release-promotion/vm/scripts_ReleasePromotion.tvm \
              --script-eval -- publication-bundle --version "$VERSION"

      - name: Attest sealed publication bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/publication-bundle/**

      - name: Upload sealed publication bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-publication-bundle
          path: target/publication-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Upload preparation failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-failure-${{ github.run_id }}
          path: target/quality
          if-no-files-found: ignore

  release-validation-result:
    name: publish release validation result
    runs-on: ubuntu-24.04
    if: always()
    needs: prepare-publication
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish workflow result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATE_RESULT: ${{ needs.prepare-publication.result }}
        with:
          script: |
            const validateResult = process.env.VALIDATE_RESULT;
            const succeeded = validateResult === "success";
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? "success" : "failure",
              context: "release-validation/run",
              description: succeeded
                ? `run ${context.runId} passed`
                : `run ${context.runId} ended with ${validateResult}`,
              target_url: targetUrl,
            });
