name: Release validation

on:
  workflow_dispatch:
  push:
    branches:
      - "release-validation/**"

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation-identity:
    name: publish release validation identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish workflow run identity
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "release-validation/run",
              description: `run ${context.runId}, attempt ${context.runAttempt}`,
              target_url: targetUrl,
            });

  multicore-runner-watchdog:
    name: bound controlled multicore runner queue
    runs-on: ubuntu-24.04
    needs: release-validation-identity
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      statuses: write

    steps:
      - name: Cancel the run if the controlled lane remains queued
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const jobName = "release VM multicore controlled performance";
            for (let attempt = 0; attempt < 20; attempt += 1) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  per_page: 100,
                },
              );
              const controlled = jobs.find((job) => job.name === jobName);
              if (controlled && controlled.status !== "queued") {
                core.info(`controlled lane reached ${controlled.status}`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "release-validation/run",
              description: "controlled multicore runner queued for more than 10 minutes",
              target_url: targetUrl,
            });
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            core.setFailed("controlled multicore runner queue exceeded 10 minutes");

  dependency-audit:
    name: release Rust dependency security audit
    runs-on: ubuntu-24.04
    needs: release-validation-identity
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Audit locked dependencies
        uses: ./.github/actions/security-audit

  platform:
    name: release AOT (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: release-validation-identity
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            archive: terlc-linux-x86_64.tar.gz
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            archive: terlc-linux-aarch64.tar.gz
          - target: macos-x86_64
            runner: macos-15-intel
            archive: terlc-macos-x86_64.tar.gz
          - target: macos-aarch64
            runner: macos-15
            archive: terlc-macos-aarch64.tar.gz
          - target: windows-x86_64
            runner: windows-2025
            archive: terlc-windows-x86_64.zip
          - target: windows-aarch64
            runner: windows-11-arm
            archive: terlc-windows-aarch64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install macOS native dependencies
        if: startsWith(matrix.target, 'macos-')
        run: |
          brew install libpq pkg-config
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.target }}" -eq "windows-aarch64") {
            "arm64-windows"
          } else {
            "x64-windows"
          }
          choco install make pkgconfiglite --yes --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libpq:$triplet"
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          $installedBin = Join-Path $installed "bin"
          $installedBin |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Validate target-native AOT consumers
        run: make tvm-aot-platform-target-check
        env:
          TERLAN_MATRIX_TARGET: ${{ matrix.target }}

      - name: Stress the portable multicore memory model
        run: cargo test --locked --no-default-features --features native-codegen -p terlan --bin terlan-vm runtime::vm::fixed_scheduler_control::fixed_scheduler_control_stress_test -- --nocapture

      - name: Build and smoke the native release archive
        run: make cli-release-artifact-current release-artifact-installer-smoke

      - name: Upload native release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distribution-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload target execution attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tvm-aot-platform-${{ matrix.target }}
          path: target/quality/tvm-aot-platform/${{ matrix.target }}.json
          if-no-files-found: error

  platform-matrix:
    name: release AOT platform matrix
    runs-on: ubuntu-24.04
    needs: platform
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Download target execution attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-tvm-aot-platform-*
          path: target/quality/tvm-aot-platform-input
          merge-multiple: true

      - name: Require the complete executable matrix
        run: make tvm-aot-platform-aggregate-check
        env:
          TERLAN_TVM_PLATFORM_REPORT_ROOT: target/quality/tvm-aot-platform-input

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tvm-aot-platform-matrix
          path: target/quality/tvm-aot-platform-matrix-report.json
          if-no-files-found: error
          retention-days: 90

  thread-sanitizer:
    name: release AOT ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: release-validation-identity
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install release utilities
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install workspace Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install pinned Rust ThreadSanitizer toolchain
        run: rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src

      - name: Validate thread-neutral AOT runtime
        run: make tvm-aot-thread-sanitizer-check

      - name: Upload ThreadSanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tvm-aot-thread-sanitizer
          path: target/quality/tvm-aot-thread-sanitizer-report.json
          if-no-files-found: error
          retention-days: 90

  multicore-thread-sanitizer:
    name: release VM multicore ThreadSanitizer
    runs-on: ubuntu-24.04
    needs: release-validation-identity
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install release utilities
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install pinned Rust ThreadSanitizer target
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnutsan

      - name: Validate multicore VM memory safety
        run: make vm-multicore-thread-sanitizer-check

      - name: Upload multicore ThreadSanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vm-multicore-thread-sanitizer
          path: |
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
          if-no-files-found: error
          retention-days: 90

  multicore-performance:
    name: release VM multicore controlled performance
    runs-on: [self-hosted, linux, x64, terlan-linux-x86_64-multicore-v1]
    needs: release-validation-identity
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify controlled runner prerequisites
        run: |
          command -v cargo
          command -v make
          command -v pkg-config
          command -v rg
          pkg-config --exists libpq

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Enforce multicore performance policy
        run: make vm-multicore-performance-check
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
          TERLAN_VM_MULTICORE_DEDICATED_RUNNER: terlan-linux-x86_64-multicore-v1
          TERLAN_BENCH_BACKGROUND_LOAD: controlled

      - name: Upload controlled multicore performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vm-multicore-performance
          path: target/quality/vm-multicore-performance.json
          if-no-files-found: error
          retention-days: 90

  multicore-evidence:
    name: seal VM multicore MC-9 evidence
    runs-on: ubuntu-24.04
    needs:
      - multicore-thread-sanitizer
      - multicore-performance
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install release utilities
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Download multicore ThreadSanitizer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-vm-multicore-thread-sanitizer
          path: target/quality

      - name: Download controlled multicore performance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-vm-multicore-performance
          path: target/quality

      - name: Seal same-run MC-9 evidence
        run: make vm-multicore-mc9-evidence-check

      - name: Upload joined multicore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vm-multicore-evidence
          path: |
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
            target/quality/vm-multicore-performance.json
            target/quality/vm-multicore-mc9-evidence.json
          if-no-files-found: error
          retention-days: 90

  validate:
    name: validate release
    runs-on: ubuntu-24.04
    needs:
      - dependency-audit
      - platform-matrix
      - thread-sanitizer
      - multicore-evidence
      - multicore-runner-watchdog
    timeout-minutes: 180
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install release utilities
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Download platform aggregate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tvm-aot-platform-matrix
          path: target/quality

      - name: Download ThreadSanitizer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tvm-aot-thread-sanitizer
          path: target/quality

      - name: Download joined multicore evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-vm-multicore-evidence
          path: target/quality

      - name: Download native release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-distribution-*
          path: target/release-distribution
          merge-multiple: true

      - name: Validate the complete release artifact set
        run: bash scripts/check_release_artifact_set.sh target/release-distribution

      - name: Validate complete multicore release
        run: make vm-multicore-release-check

      - name: Validate and seal complete AOT closeout
        run: make tvm-aot-release-closeout-check TERLAN_MULTICORE_CLOSEOUT_ALREADY_RUN=1

      - name: Upload AOT closeout evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tvm-aot-closeout
          path: |
            target/quality/tvm-aot-release-closeout-report.json
            target/quality/tvm-aot-release-clean-checkout.json
            target/quality/tvm-aot-platform-matrix-report.json
            target/quality/tvm-aot-thread-sanitizer-report.json
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
            target/quality/vm-multicore-performance.json
            target/quality/vm-multicore-mc9-evidence.json
            target/quality/vm-multicore-release-closeout.json
            target/quality/aot-compilation-benchmark.json
            target/quality/http-aot-performance-comparison.json
            target/quality/tvm-managed-list-profile.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest the validated native distribution
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: target/release-distribution/*

      - name: Upload validated release distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distribution
          path: target/release-distribution
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-failure-${{ github.run_id }}
          path: |
            target/quality
            build/artifacts
          if-no-files-found: ignore

  release-validation-result:
    name: publish release validation result
    runs-on: ubuntu-24.04
    if: always()
    needs: validate
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Publish workflow result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const validateResult = process.env.VALIDATE_RESULT;
            const succeeded = validateResult === "success";
            const targetUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? "success" : "failure",
              context: "release-validation/run",
              description: succeeded
                ? `run ${context.runId} passed`
                : `run ${context.runId} ended with ${validateResult}`,
              target_url: targetUrl,
            });
