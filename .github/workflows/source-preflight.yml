name: Source preflight

on:
  workflow_call:
    inputs:
      mode:
        description: Run full source validation or contracts only
        required: false
        default: full
        type: string
      base_revision:
        description: Base revision used to select changed formatting inputs
        required: true
        type: string
      head_revision:
        description: Exact candidate revision
        required: true
        type: string
      rust_format:
        description: Whether Rust formatting inputs changed
        required: true
        type: boolean
      generated:
        description: Whether committed generated-artifact inputs changed
        required: true
        type: boolean
      generated_summaries:
        description: Whether reviewed standard-library summaries changed
        required: true
        type: boolean
      generated_js_bindings:
        description: Whether generated JavaScript binding inputs changed
        required: true
        type: boolean
      generated_native_artifacts:
        description: Whether generated native metadata inputs changed
        required: true
        type: boolean
      generated_release_manifest:
        description: Whether generated release manifest inputs changed
        required: true
        type: boolean
      generated_tree_sitter:
        description: Whether generated Tree-sitter inputs changed
        required: true
        type: boolean
      rust_format_all:
        description: Whether the global Rust formatting contract changed
        required: true
        type: boolean
      terlan_style:
        description: Whether Terlan style inputs changed
        required: true
        type: boolean
      terlan_style_all:
        description: Whether the global Terlan style contract changed
        required: true
        type: boolean
      ci_contracts:
        description: Whether CI classification contracts changed
        required: true
        type: boolean
      editor:
        description: Whether editor integration inputs changed
        required: true
        type: boolean
      inventory:
        description: Whether source inventory inputs changed
        required: true
        type: boolean
      release_tooling:
        description: Whether release build-plan inputs changed
        required: true
        type: boolean
      hooks:
        description: Whether staged-hook inputs changed
        required: true
        type: boolean
      workflow:
        description: Whether hosted workflow inputs changed
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  source-preflight:
    name: Source and release-tool checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate preflight mode
        env:
          PREFLIGHT_MODE: ${{ inputs.mode }}
        run: '[[ "$PREFLIGHT_MODE" == full || "$PREFLIGHT_MODE" == contracts ]]'
      - name: Setup Terlan script runner
        id: script-runner
        uses: ./.github/actions/setup-terlan-script-runner
      - name: Install Node for generated and editor checks
        if: ${{ inputs.generated || inputs.editor }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check every generated artifact for drift
        if: ${{ inputs.generated }}
        env:
          TERLAN_GENERATED_SUMMARIES: ${{ inputs.generated_summaries && '1' || '0' }}
          TERLAN_GENERATED_JS_BINDINGS: ${{ inputs.generated_js_bindings && '1' || '0' }}
          TERLAN_GENERATED_NATIVE_ARTIFACTS: ${{ inputs.generated_native_artifacts && '1' || '0' }}
          TERLAN_GENERATED_RELEASE_MANIFEST: ${{ inputs.generated_release_manifest && '1' || '0' }}
          TERLAN_GENERATED_TREE_SITTER: ${{ inputs.generated_tree_sitter && '1' || '0' }}
        run: |
          make --no-print-directory source-generated-artifacts-check TERLAN_VALIDATION_BOOTSTRAPPED=1 TERLC=${{ steps.script-runner.outputs.terlc }}
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Test CI change classification
        if: ${{ inputs.ci_contracts }}
        run: ${{ steps.script-runner.outputs.terlc }} test scripts/ci --coverage --coverage-threshold 100
      - name: Check editor release contracts
        if: ${{ inputs.editor }}
        run: make editor-release-contract-check
      - name: Install Rust toolchain
        if: ${{ inputs.rust_format }}
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-registry: "false"
      - name: Check changed Rust formatting
        if: ${{ inputs.rust_format }}
        env:
          BASE_REVISION: ${{ inputs.base_revision }}
          HEAD_REVISION: ${{ inputs.head_revision }}
          FORMAT_ALL: ${{ inputs.rust_format_all }}
        run: |
          ${{ steps.script-runner.outputs.vm }} run \
            ${{ steps.script-runner.outputs.rust-format-image }} \
            --script-eval -- \
            --revisions "$BASE_REVISION" "$HEAD_REVISION" "$FORMAT_ALL"
      - name: Validate release payload inputs
        if: ${{ inputs.release_tooling }}
        run: ${{ steps.script-runner.outputs.terlc }} test scripts/self_validation/tvm_aot_platform_matrix/src/tvm_aot_platform_matrix/ReleasePayloadInputTest.terl --coverage --coverage-threshold 100
      - name: Check Terlan readability canonicalization
        if: ${{ inputs.terlan_style }}
        env:
          BASE_REVISION: ${{ inputs.base_revision }}
          HEAD_REVISION: ${{ inputs.head_revision }}
          STYLE_ALL: ${{ inputs.terlan_style_all }}
        run: |
          ${{ steps.script-runner.outputs.vm }} run \
            ${{ steps.script-runner.outputs.terlan-style-image }} \
            --script-eval -- \
            "$BASE_REVISION" "$HEAD_REVISION" "$STYLE_ALL" \
            "${{ steps.script-runner.outputs.terlc }}"
      - name: Check source inventory and test ownership
        if: ${{ inputs.inventory }}
        run: ${{ steps.script-runner.outputs.terlc }} test scripts/self_validation/InventoryTest.terl --coverage --coverage-threshold 100
      - name: Install release-tool test dependencies
        if: ${{ inputs.hooks }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
      - name: Test staged Git hook isolation
        if: ${{ inputs.hooks }}
        run: |
          bash scripts/build_artifact_bootstrap_test.sh
          bash scripts/git_hooks_test.sh
          bash scripts/publish_command_test.sh
          bash scripts/download_publication_bundle_test.sh
      - name: Install pinned Go toolchain for actionlint
        if: ${{ inputs.workflow }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false
      - name: Restore actionlint build cache
        if: ${{ inputs.workflow }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-go1.25.0-v1.7.12
      - name: Validate workflow syntax
        if: ${{ inputs.workflow }}
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false .github/workflows/*.yml
