name: Publish tagged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the validated tag
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      checks: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TERLAN_RELEASE_WAIT_SECONDS: "14400"
      TERLAN_TAG_PUBLICATION: "1"
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # An explicit ref preserves the tag object instead of fetching the event SHA over it.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          fi
          git merge-base --is-ancestor HEAD origin/main
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          gh auth setup-git --hostname github.com

      - name: Restore the sealed publication bundle
        run: bash scripts/download_publication_bundle.sh "$(git rev-parse HEAD)"

      - name: Publish the existing sealed tag
        env:
          TERLAN_PUBLICATION_PLAN: ${{ github.workspace }}/target/publication-bundle/publication-plan.json
        run: |
          timeout --kill-after=10s 1800s \
            bash scripts/publish_release_from_dist.sh "$VERSION" </dev/null

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: target/quality
          if-no-files-found: ignore
          retention-days: 90
