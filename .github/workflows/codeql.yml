name: CodeQL Actions

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  schedule:
    - cron: "31 3 * * 4"

permissions:
  contents: read

concurrency:
  group: codeql-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-language.yml
    with:
      language: actions
