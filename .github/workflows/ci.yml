name: Compiler CI

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact commit expected at the selected ref
        required: false
        type: string
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".gitignore"
      - "benchmarks/**"
      - "build/**"
      - "crates/**"
      - "mk/**"
      - "proofs/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/source-preflight.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/codeql-language.yml"
      - ".github/workflows/codeql-rust.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/WORKFLOWS.md"
  push:
    branches:
      - main
      - "agent/aot-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".gitignore"
      - "benchmarks/**"
      - "build/**"
      - "crates/**"
      - "mk/**"
      - "proofs/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/source-preflight.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/codeql-language.yml"
      - ".github/workflows/codeql-rust.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/WORKFLOWS.md"

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source: ${{ steps.classify.outputs.source }}
      compiler: ${{ steps.classify.outputs.compiler }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the requested revision
        if: ${{ inputs.expected_revision != '' }}
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_REVISION" = "$GITHUB_SHA"
      - name: Setup Terlan script runner
        id: script-runner
        uses: ./.github/actions/setup-terlan-script-runner
      - name: Classify changed files
        id: classify
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "${{ steps.script-runner.outputs.terlc }}" run \
            scripts/ci/scripts/ClassifyChanges.terls -- \
            "$BASE_REVISION" "$HEAD_REVISION" "$GITHUB_OUTPUT"

  source-preflight:
    needs: changes
    uses: ./.github/workflows/source-preflight.yml
    with:
      mode: ${{ needs.changes.outputs.source == 'true' && 'full' || 'contracts' }}

  dependency-audit:
    name: Locked dependency security audit
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Audit locked dependencies
        uses: ./.github/actions/security-audit

  direct-aot-platform:
    needs: [changes, source-preflight, check]
    name: Direct AOT (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: ${{ needs.changes.outputs.compiler == 'true' && github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
          - target: windows-aarch64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install target-native dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: ${{ matrix.target }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-build: "true"
          cache-scope: ${{ matrix.runner }}

      - name: Validate target-native AOT consumers
        run: make tvm-aot-platform-target-check
        env:
          TERLAN_MATRIX_TARGET: ${{ matrix.target }}

      - name: Upload target execution attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvm-aot-platform-${{ matrix.target }}
          path: target/quality/tvm-aot-platform/${{ matrix.target }}.json
          if-no-files-found: error

  direct-aot-platform-matrix:
    name: Direct AOT platform matrix
    runs-on: ubuntu-24.04
    needs: direct-aot-platform
    if: ${{ github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native build dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-build: "true"
          cache-scope: ubuntu-24.04

      - name: Download target execution attestations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tvm-aot-platform-*
          path: target/quality/tvm-aot-platform-input
          merge-multiple: true

      - name: Require the complete executable matrix
        run: make tvm-aot-platform-aggregate-check
        env:
          TERLAN_TVM_PLATFORM_REPORT_ROOT: target/quality/tvm-aot-platform-input

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvm-aot-platform-matrix
          path: target/quality/tvm-aot-platform-matrix-report.json
          if-no-files-found: error
          retention-days: 90

  aot-thread-sanitizer:
    needs: [changes, source-preflight, check]
    name: Direct AOT ThreadSanitizer
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.compiler == 'true' && github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native build dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64

      - name: Install pinned Rust ThreadSanitizer toolchain
        run: |
          rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src

      - name: Install workspace Rust toolchain and cache Cargo inputs
        uses: ./.github/actions/setup-rust
        with:
          components: ""
          cache-build: "true"
          cache-scope: ubuntu-24.04

      - name: Validate thread-neutral AOT runtime
        run: make tvm-aot-thread-sanitizer-check

      - name: Upload ThreadSanitizer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvm-aot-thread-sanitizer
          path: target/quality/tvm-aot-thread-sanitizer-report.json
          if-no-files-found: error
          retention-days: 90

  multicore-thread-sanitizer:
    needs: [changes, source-preflight, check]
    name: VM multicore ThreadSanitizer
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.compiler == 'true' && github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native build dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64

      - name: Install pinned Rust ThreadSanitizer target
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnutsan
          components: ""
          cache-build: "true"
          cache-scope: ubuntu-24.04

      - name: Validate multicore VM memory safety
        run: make vm-multicore-thread-sanitizer-check

      - name: Upload multicore ThreadSanitizer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-multicore-thread-sanitizer
          path: |
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
          if-no-files-found: error
          retention-days: 90

  check:
    needs: [changes, source-preflight]
    name: Compiler check and test
    runs-on: ubuntu-24.04
    if: ${{ needs.changes.outputs.compiler == 'true' && (github.event_name != 'push' || !startsWith(github.ref_name, 'release-validation/')) }}
    # Cold hosted runs need about 114 minutes before the remaining stdlib,
    # proof, runtime, and package gates; allow the complete validation to finish.
    timeout-minutes: 180
    outputs:
      coverage-artifact-id: ${{ steps.coverage.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native build dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64
          lean: "true"

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/setup-rust
        with:
          cache-build: "true"
          cache-scope: ubuntu-24.04
          cache-profile: compiler-validation

      - name: Validate release candidate
        id: release-candidate
        run: make release-candidate-check
        env:
          # The serialized compiler library suite exceeds thirty minutes on
          # hosted runners; retain a bounded deadline without skipping tests.
          TERLAN_TEST_PHASE_TIMEOUT_SECONDS: "3600"

      - name: Preserve compiled Rust cache
        if: ${{ always() && steps.rust.outputs.compiled-cache-key != '' && steps.rust.outputs.compiled-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ${{ steps.rust.outputs.compiled-cache-key }}

      - name: Test local commit policy
        run: target/debug/terlc test scripts/git_hooks/src/git_hooks/PlanTest.terl

      - name: Upload completed compiler coverage
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/rust-test-suite-report.json
            target/quality/rust-test-suite-report.json.selections.json
            target/quality/rust-test-suite-report.json.make-coverage.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-ci-failure-${{ github.run_id }}
          path: target/quality
          if-no-files-found: ignore

  attest-compiler-coverage:
    name: Attest compiler test coverage
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # The successful producer's immutable ID survives a signing-only retry.
      # Never execute downloaded compiler artifacts in this privileged job.
      - name: Require the completed producer artifact
        env:
          COVERAGE_ARTIFACT_ID: ${{ needs.check.outputs.coverage-artifact-id }}
        run: '[[ "$COVERAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download completed compiler coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.coverage-artifact-id }}
          path: coverage
          merge-multiple: true

      - name: Attest completed compiler records
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            coverage/rust-test-suite-report.json
            coverage/rust-test-suite-report.json.selections.json
            coverage/rust-test-suite-report.json.make-coverage.json
