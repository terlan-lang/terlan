name: Compiler CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/grammar/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/grammar/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  direct-aot-platform:
    name: Direct AOT (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
          - target: windows-aarch64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Validate target-native AOT consumers
        run: python -B tools/check_tvm_aot_platform_matrix.py target
        env:
          TERLAN_MATRIX_TARGET: ${{ matrix.target }}

      - name: Upload target execution attestation
        uses: actions/upload-artifact@v4
        with:
          name: tvm-aot-platform-${{ matrix.target }}
          path: target/quality/tvm-aot-platform/${{ matrix.target }}.json
          if-no-files-found: error

  direct-aot-platform-matrix:
    name: Direct AOT platform matrix
    runs-on: ubuntu-24.04
    needs: direct-aot-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download target execution attestations
        uses: actions/download-artifact@v4
        with:
          pattern: tvm-aot-platform-*
          path: target/quality/tvm-aot-platform-input
          merge-multiple: true

      - name: Require the complete executable matrix
        run: python -B tools/check_tvm_aot_platform_matrix.py aggregate target/quality/tvm-aot-platform-input

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvm-aot-platform-matrix
          path: target/quality/tvm-aot-platform-matrix-report.json
          if-no-files-found: error
          retention-days: 90

  aot-thread-sanitizer:
    name: Direct AOT ThreadSanitizer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ThreadSanitizer target
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnutsan

      - name: Validate thread-neutral AOT runtime
        run: make tvm-aot-thread-sanitizer-check

      - name: Upload ThreadSanitizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvm-aot-thread-sanitizer
          path: target/quality/tvm-aot-thread-sanitizer-report.json
          if-no-files-found: error
          retention-days: 90

  # Non-AOT feature jobs are intentionally paused during the hard AOT cutover.
  # cpp-metadata-extractor:
  #   ...

  check:
    name: Compiler check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Validate AOT cutover
        run: make release-candidate-check

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ci-failure-${{ github.run_id }}
          path: |
            target/quality
            build/artifacts
          if-no-files-found: ignore
