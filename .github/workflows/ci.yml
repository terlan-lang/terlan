name: Compiler CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".gitignore"
      - "benchmarks/**"
      - "build/**"
      - "crates/**"
      - "mk/**"
      - "proofs/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/WORKFLOWS.md"
  push:
    branches:
      - main
      - "agent/aot-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".gitignore"
      - "benchmarks/**"
      - "build/**"
      - "crates/**"
      - "mk/**"
      - "proofs/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/WORKFLOWS.md"

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-24.04
    if: ${{ github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Audit locked dependencies
        uses: ./.github/actions/security-audit

  direct-aot-platform:
    name: Direct AOT (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: ${{ github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
          - target: windows-aarch64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install target-native dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: ${{ matrix.target }}

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Validate target-native AOT consumers
        run: make tvm-aot-platform-target-check
        env:
          TERLAN_MATRIX_TARGET: ${{ matrix.target }}

      - name: Upload target execution attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvm-aot-platform-${{ matrix.target }}
          path: target/quality/tvm-aot-platform/${{ matrix.target }}.json
          if-no-files-found: error

  direct-aot-platform-matrix:
    name: Direct AOT platform matrix
    runs-on: ubuntu-24.04
    needs: direct-aot-platform
    if: ${{ github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap libpq-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Download target execution attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tvm-aot-platform-*
          path: target/quality/tvm-aot-platform-input
          merge-multiple: true

      - name: Require the complete executable matrix
        run: make tvm-aot-platform-aggregate-check
        env:
          TERLAN_TVM_PLATFORM_REPORT_ROOT: target/quality/tvm-aot-platform-input

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvm-aot-platform-matrix
          path: target/quality/tvm-aot-platform-matrix-report.json
          if-no-files-found: error
          retention-days: 90

  aot-thread-sanitizer:
    name: Direct AOT ThreadSanitizer
    runs-on: ubuntu-24.04
    if: ${{ github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap libpq-dev pkg-config ripgrep

      - name: Install pinned Rust ThreadSanitizer toolchain
        run: |
          rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src

      - name: Install workspace Rust toolchain and cache Cargo inputs
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Validate thread-neutral AOT runtime
        run: make tvm-aot-thread-sanitizer-check

      - name: Upload ThreadSanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvm-aot-thread-sanitizer
          path: target/quality/tvm-aot-thread-sanitizer-report.json
          if-no-files-found: error
          retention-days: 90

  multicore-thread-sanitizer:
    name: VM multicore ThreadSanitizer
    runs-on: ubuntu-24.04
    if: ${{ github.ref_name != 'main' && !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install pinned Rust ThreadSanitizer target
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnutsan
          components: ""

      - name: Validate multicore VM memory safety
        run: make vm-multicore-thread-sanitizer-check

      - name: Upload multicore ThreadSanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-multicore-thread-sanitizer
          path: |
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
          if-no-files-found: error
          retention-days: 90

  check:
    name: Compiler check and test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'push' || !startsWith(github.ref_name, 'release-validation/') }}
    timeout-minutes: 120
    outputs:
      coverage-artifact-id: ${{ steps.coverage.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap elan libpq-dev pkg-config ripgrep
          # Ubuntu 24.04 otherwise denies the unprivileged user namespace that
          # the fail-closed bubblewrap capability-worker sandbox must create.
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat proofs/lean/lean-toolchain)"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install pinned Go toolchain for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false

      - name: Restore actionlint build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-go1.25.0-v1.7.12

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false .github/workflows/*.yml

      - name: Validate AOT cutover
        run: make release-candidate-check

      - name: Upload completed compiler coverage
        id: coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/rust-test-suite-report.json
            target/quality/rust-test-suite-report.json.selections.json
            target/quality/rust-test-suite-report.json.make-coverage.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-ci-failure-${{ github.run_id }}
          path: target/quality
          if-no-files-found: ignore

  attest-compiler-coverage:
    name: Attest compiler test coverage
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # The successful producer's immutable ID survives a signing-only retry.
      # Never execute downloaded compiler artifacts in this privileged job.
      - name: Require the completed producer artifact
        env:
          COVERAGE_ARTIFACT_ID: ${{ needs.check.outputs.coverage-artifact-id }}
        run: '[[ "$COVERAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download completed compiler coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.check.outputs.coverage-artifact-id }}
          path: coverage
          merge-multiple: true

      - name: Attest completed compiler records
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            coverage/rust-test-suite-report.json
            coverage/rust-test-suite-report.json.selections.json
            coverage/rust-test-suite-report.json.make-coverage.json
