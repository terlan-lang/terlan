name: Compiler CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".gitignore"
      - "benchmarks/**"
      - "build/**"
      - "crates/**"
      - "mk/**"
      - "proofs/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/WORKFLOWS.md"
  push:
    branches:
      - main
      - "agent/aot-*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".gitignore"
      - "benchmarks/**"
      - "build/**"
      - "crates/**"
      - "mk/**"
      - "proofs/**"
      - "std/**"
      - "editors/**"
      - "tree-sitter-terlan/**"
      - "tests/**"
      - "docs/**"
      - "tools/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/WORKFLOWS.md"

permissions:
  contents: read

concurrency:
  group: compiler-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Audit locked dependencies
        uses: ./.github/actions/security-audit

  direct-aot-platform:
    name: Direct AOT (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
          - target: windows-aarch64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install macOS native dependencies
        if: startsWith(matrix.target, 'macos-')
        run: |
          brew install libpq pkg-config
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.target }}" -eq "windows-aarch64") {
            "arm64-windows"
          } else {
            "x64-windows"
          }
          choco install make pkgconfiglite --yes --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libpq:$triplet"
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          $installedBin = Join-Path $installed "bin"
          $installedBin |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Validate target-native AOT consumers
        run: make tvm-aot-platform-target-check
        env:
          TERLAN_MATRIX_TARGET: ${{ matrix.target }}

      - name: Stress the portable multicore memory model
        run: cargo test --locked --no-default-features --features native-codegen -p terlan --bin terlan-vm runtime::vm::fixed_scheduler_control::fixed_scheduler_control_stress_test -- --nocapture

      - name: Upload target execution attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvm-aot-platform-${{ matrix.target }}
          path: target/quality/tvm-aot-platform/${{ matrix.target }}.json
          if-no-files-found: error

  direct-aot-platform-matrix:
    name: Direct AOT platform matrix
    runs-on: ubuntu-24.04
    needs: direct-aot-platform
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap libpq-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Download target execution attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tvm-aot-platform-*
          path: target/quality/tvm-aot-platform-input
          merge-multiple: true

      - name: Require the complete executable matrix
        run: make tvm-aot-platform-aggregate-check
        env:
          TERLAN_TVM_PLATFORM_REPORT_ROOT: target/quality/tvm-aot-platform-input

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvm-aot-platform-matrix
          path: target/quality/tvm-aot-platform-matrix-report.json
          if-no-files-found: error
          retention-days: 90

  aot-thread-sanitizer:
    name: Direct AOT ThreadSanitizer
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap libpq-dev pkg-config ripgrep

      - name: Install pinned Rust ThreadSanitizer toolchain
        run: |
          rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src

      - name: Install workspace Rust toolchain and cache Cargo inputs
        uses: ./.github/actions/setup-rust
        with:
          components: ""

      - name: Validate thread-neutral AOT runtime
        run: make tvm-aot-thread-sanitizer-check

      - name: Upload ThreadSanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvm-aot-thread-sanitizer
          path: target/quality/tvm-aot-thread-sanitizer-report.json
          if-no-files-found: error
          retention-days: 90

  multicore-thread-sanitizer:
    name: VM multicore ThreadSanitizer
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'release-validation/') }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install pinned Rust ThreadSanitizer target
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnutsan
          components: ""

      - name: Validate multicore VM memory safety
        run: make vm-multicore-thread-sanitizer-check

      - name: Upload multicore ThreadSanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-multicore-thread-sanitizer
          path: |
            target/quality/vm-multicore-thread-sanitizer-report.json
            target/quality/vm-multicore-memory-model-tsan.json
          if-no-files-found: error
          retention-days: 90

  check:
    name: Compiler check and test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'push' || !startsWith(github.ref_name, 'release-validation/') }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap elan libpq-dev pkg-config ripgrep

      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat proofs/lean/lean-toolchain)"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install pinned Go toolchain for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.0"
          cache: false

      - name: Restore actionlint build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-go1.25.0-v1.7.12

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color=false .github/workflows/*.yml

      - name: Validate MC-9 evidence contract
        run: make vm-multicore-mc9-evidence-contract-check

      - name: Validate AOT cutover
        run: make release-candidate-check

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-ci-failure-${{ github.run_id }}
          path: |
            target/quality
            build/artifacts
          if-no-files-found: ignore
