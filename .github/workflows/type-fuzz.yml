name: Scheduled type fuzzing

on:
  workflow_dispatch:
    inputs:
      rotation:
        description: Deterministic seed rotation (defaults to workflow run number)
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: scheduled-type-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scheduled-type-fuzz:
    name: Rotating type corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install native build dependencies
        uses: ./.github/actions/setup-native-dependencies
        with:
          target: linux-x86_64
          lean: "true"

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-build: "true"
          cache-scope: ubuntu-24.04
          cache-profile: type-fuzz

      - name: Build candidate compiler once
        run: make --no-print-directory terlan-compiler-bootstrap

      - name: Run rotating and mutation-derived corpus
        env:
          ROTATION: ${{ inputs.rotation || github.run_number }}
        run: |
          [[ "$ROTATION" =~ ^[0-9]+$ ]]
          target/debug/terlc fuzz profile scheduled \
            --rotation "$ROTATION" \
            --out-dir target/fuzz/profile/scheduled

      - name: Retain fuzz metrics and reduced cases
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-type-fuzz-${{ github.run_id }}
          path: target/fuzz/profile/scheduled
          if-no-files-found: ignore
          retention-days: 7
