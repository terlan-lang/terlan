name: Docs CI

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/WORKFLOWS.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/WORKFLOWS.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs-light:
    name: Docs light checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown hygiene
        run: make docs-light-check
