name: Docs CI

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/WORKFLOWS.md"
      - ".github/actions/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/WORKFLOWS.md"
      - ".github/actions/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-light:
    name: Docs light checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpq-dev pkg-config ripgrep

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Markdown hygiene
        run: make docs-light-check
