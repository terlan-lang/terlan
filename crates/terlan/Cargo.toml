[package]
name = "terlan"
version.workspace = true
edition.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }
warnings = "deny"

[[bin]]
name = "terlc"
path = "src/main.rs"

[[bin]]
name = "terlan-vm"
path = "src/vm/main.rs"

[[bin]]
name = "terlan-native-worker"
path = "src/native_worker/main.rs"

[[bin]]
name = "terlan-lsp"
path = "src/lsp/main.rs"
required-features = ["editor-lsp"]

[[bin]]
name = "terlan-quality"
path = "src/quality/main.rs"

[[bin]]
name = "terlan-test-orchestrator"
path = "src/quality/test_orchestrator_main.rs"

[[bin]]
name = "terlan-native-target-feasibility"
path = "src/quality/native_no_std_target_feasibility_main.rs"

[[bin]]
name = "terlan-lean-proof-closeout"
path = "src/quality/lean_proof_closeout_main.rs"

[[bin]]
name = "terlan-benchmark"
path = "src/benchmark/main.rs"

[[bin]]
name = "terlan-axum-baseline"
path = "src/benchmark/axum_baseline.rs"
required-features = ["axum-baseline"]

[[bin]]
name = "terlan-http-framework-benchmark"
path = "src/benchmark/http_framework_baseline.rs"
required-features = ["axum-baseline"]

[features]
default = []
acme-live = ["dep:tokio"]
editor-lsp = ["dep:tower-lsp", "dep:tokio", "tokio/io-std"]
axum-baseline = ["dep:axum", "dep:tokio", "tokio/macros", "tokio/net", "tokio/rt-multi-thread"]

[dependencies]
ammonia = "4.1.2"
axum = { version = "0.8.9", optional = true }
base64 = "0.22.1"
basic-toml = "0.1.10"
comrak = "0.52"
concurrent-queue = "2.5.0"
cookie = "0.18"
cranelift-codegen = "=0.133.1"
cranelift-frontend = "=0.133.1"
cranelift-module = "=0.133.1"
cranelift-native = "=0.133.1"
cranelift-object = "=0.133.1"
crossterm = "0.28.1"
cssparser = "0.35.0"
html5ever = "0.35.0"
mime_guess = "2"
md-5 = "0.11.0"
mio = { version = "1.2.2", features = ["net", "os-poll"] }
oxc_allocator = "0.134.0"
oxc_ast = "0.134.0"
oxc_codegen = "0.134.0"
oxc_parser = "0.134.0"
oxc_span = "0.134.0"
oxc_syntax = "0.134.0"
bytes = "1"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = { version = "0.1.3", features = ["channel", "full"] }
httparse = "1.10.1"
hyper = { version = "1.10.1", features = ["client", "http1", "server"] }
instant-acme = "0.7"
libloading = "=0.9.0"
notify = "8"
object = { version = "=0.39.1", default-features = false, features = ["read", "write", "std"] }
openapiv3 = "2.2.0"
percent-encoding = "2.3.2"
quick-xml = "0.39.4"
rcgen = "0.13"
rand = "0.9.4"
rand_chacha = "0.9.0"
refinery = "0.8"
regex = "1"
rustls = "0.23"
rustls-pemfile = "2"
rustls-webpki = "0.103.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
shell-words = "1.1.1"
socket2 = { version = "0.6.1", features = ["all"] }
smallvec = "1.15.2"
sqlparser = "=0.60.0"
tar = "0.4.44"
terlan-libpq = { path = "../../std/native/libpq/generated/native/rust" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt"], optional = true }
tower-lsp = { version = "0.20", optional = true }
tungstenite = "0.28"
url = "2.5.8"
docker-compose-types = "0.24.0"
wasm-encoder = "0.252.0"
wasmparser = "0.252.0"
yaml-rust = "0.4.5"
ratatui = "0.29.0"
zstd = "0.13.3"

[dev-dependencies]
cxx = "=1.0.197"
cxx-build = "=1.0.197"
tokio = { version = "1", features = ["io-util", "macros", "time"] }
wat = "1.252.0"
