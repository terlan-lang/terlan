[package]
name = "terlan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "terlc"
path = "src/main.rs"

[[bin]]
name = "terlan-vm"
path = "src/vm/main.rs"

[[bin]]
name = "terlan-serve-runtime"
path = "src/serve_runtime/main.rs"
required-features = ["serve-runtime-bin"]

[[bin]]
name = "terlan-serve-runtime-trusted"
path = "src/serve_runtime/trusted_main.rs"
required-features = ["native-codegen", "postgres-libpq"]

[[bin]]
name = "terlan-native-worker"
path = "src/native_worker/main.rs"

[[bin]]
name = "terlan-lsp"
path = "src/lsp/main.rs"
required-features = ["editor-lsp"]

[[bin]]
name = "terlan-quality"
path = "src/quality/main.rs"
required-features = ["quality-tools"]

[[bin]]
name = "terlan-native-target-feasibility"
path = "src/quality/native_no_std_target_feasibility_main.rs"
required-features = ["quality-tools"]

[[bin]]
name = "terlan-lean-proof-closeout"
path = "src/quality/lean_proof_closeout_main.rs"
required-features = ["quality-tools"]

[[bin]]
name = "terlan-accelerator-value-contract"
path = "src/quality/accelerator_value_contract_main.rs"

[[bin]]
name = "terlan-accelerator-target-admission"
path = "src/quality/accelerator_target_admission_main.rs"

[[bin]]
name = "terlan-accelerator-ir"
path = "src/quality/accelerator_ir_main.rs"

[[bin]]
name = "terlan-accelerator-aot-backend"
path = "src/quality/accelerator_aot_backend_main.rs"

[[bin]]
name = "terlan-accelerator-placement"
path = "src/quality/accelerator_placement_main.rs"

[[bin]]
name = "terlan-accelerator-vm-integration"
path = "src/quality/accelerator_vm_integration_main.rs"

[[bin]]
name = "terlan-accelerator-specialized-artifact"
path = "src/quality/accelerator_specialized_artifact_main.rs"

[[bin]]
name = "terlan-benchmark"
path = "src/benchmark/main.rs"
required-features = ["benchmark-tools"]

[[bin]]
name = "terlan-axum-baseline"
path = "src/benchmark/axum_baseline.rs"
required-features = ["axum-baseline"]

[[bin]]
name = "terlan-http-framework-benchmark"
path = "src/benchmark/http_framework_baseline.rs"
required-features = ["axum-baseline"]

[[bin]]
name = "terlan-multicore-tsan-harness"
path = "src/quality/multicore_tsan_harness.rs"
required-features = ["multicore-tsan-harness"]

[[bin]]
name = "terlan-hyper-baseline"
path = "src/benchmark/hyper_baseline.rs"
required-features = ["axum-baseline"]

[[bin]]
name = "terlan-http-paired-benchmark"
path = "src/benchmark/http_paired_benchmark.rs"
required-features = ["benchmark-tools"]

[features]
default = ["native-codegen", "postgres-libpq", "registry-network", "service-foundation"]
serve-runtime-bin = ["service-foundation"]
registry-network = ["dep:ureq"]
service-foundation = ["dep:terlan-service-foundation"]
acme-live = ["dep:tokio"]
editor-lsp = ["dep:tower-lsp", "dep:tokio", "tokio/io-std"]
axum-baseline = ["dep:axum", "dep:hyper-util", "dep:tokio", "tokio/macros", "tokio/net", "tokio/rt-multi-thread"]
benchmark-tools = []
multicore-tsan-harness = ["native-codegen"]
quality-tools = ["dep:shell-words"]
native-codegen = [
  "registry-network",
  "service-foundation",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-module",
  "dep:cranelift-native",
  "dep:cranelift-object",
]
postgres-libpq = ["dep:terlan-libpq"]

[dependencies]
ammonia = "4.1.4"
axum = { version = "0.8.9", optional = true }
base64.workspace = true
basic-toml = "0.1.10"
comrak = { version = "0.54", default-features = false }
concurrent-queue = "2.5.0"
cookie = "0.18"
cranelift-codegen = { version = "=0.133.1", optional = true }
cranelift-frontend = { version = "=0.133.1", optional = true }
cranelift-module = { version = "=0.133.1", optional = true }
cranelift-native = { version = "=0.133.1", optional = true }
cranelift-object = { version = "=0.133.1", optional = true }
crossterm = "0.28.1"
cssparser = "0.37.0"
html5ever = "0.39.0"
mime_guess = "2"
lalrpop-util = { version = "=0.23.1", default-features = false }
md-5 = "0.11.0"
mio = { version = "1.2.2", features = ["net", "os-poll"] }
oxc_allocator = "0.146.0"
oxc_ast = "0.134.0"
oxc_codegen = "0.134.0"
oxc_parser = "0.134.0"
oxc_span = "0.134.0"
oxc_syntax = "0.134.0"
bytes = "1"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = { version = "0.1.3", features = ["channel", "full"] }
httparse = "1.10.1"
hyper = { version = "1.10.1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"], optional = true }
instant-acme = "0.7"
libloading = "=0.9.0"
notify = "8"
object = { version = "=0.39.1", default-features = false, features = ["read", "write", "std"] }
openapiv3 = "2.2.0"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
rcgen = "0.13"
rand = "0.10.2"
regex = "1"
rustls = "0.23"
rustls-webpki = "0.103.13"
semver = "1.0.28"
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_yaml = "0.9.34"
sha2.workspace = true
shell-words = { version = "1.1.1", optional = true }
socket2 = { version = "0.6.1", features = ["all"] }
smallvec = "1.15.2"
spdx = "=0.13.5"
sqlparser = "=0.60.0"
target-lexicon = "0.13.5"
terlan-archive.workspace = true
terl-docs.workspace = true
terlan-runtime-abi.workspace = true
terlan-service-foundation = { workspace = true, optional = true }
terlan-libpq = { path = "../../std/native/libpq/generated/native/rust", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt"], optional = true }
tower-lsp = { version = "0.20", optional = true }
tungstenite = "0.28"
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"], optional = true }
url = "2.5.8"
docker-compose-types = "0.24.0"
wasm-encoder = "0.252.0"
wasmparser = "0.252.0"

[dev-dependencies]
cxx.workspace = true
cxx-build.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
tar.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "time"] }
zstd.workspace = true

[build-dependencies]
lalrpop = { version = "=0.23.1", default-features = false }
sha2.workspace = true
