[package]
namespace = "terlan_libpq"
adapter = "c-abi"
crate = "terlan-libpq"

[c_metadata]
schema = "terlan.c.metadata.v1"
producer = "terlan-curated-metadata"
format = "reviewed-declaration-json"
abi_version = 1

[runtime]
bridge = "native_boundary"
ownership = "opaque_handles"
raw_pointers_public = false
raw_pointers_contained_in_adapter = true
exceptions_cross_boundary = false

[functions."terlan_libpq.Driver.start"]
operation = "postgres.libpq.connection.start"
arity = 1
returns = "Connection"
blocking = "fast"
resource = "opaque_handle"

[functions."terlan_libpq.Driver.dispose_connection"]
operation = "postgres.libpq.connection.dispose"
arity = 1
returns = "Unit"
blocking = "fast"
resource = "dispose_handle"

[functions."terlan_libpq.Driver.socket"]
operation = "postgres.libpq.connection.socket"
arity = 1
returns = "Int"
blocking = "fast"
resource = "borrowed_handle"

[functions."terlan_libpq.Driver.poll_connect"]
operation = "postgres.libpq.connection.poll_connect"
arity = 1
returns = "Int"
blocking = "async"
resource = "mutable_handle"

[functions."terlan_libpq.Driver.error_length"]
operation = "postgres.libpq.connection.error_length"
arity = 1
returns = "Int"
blocking = "fast"
resource = "mutable_handle"

[functions."terlan_libpq.Driver.error_bytes"]
