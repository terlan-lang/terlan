[package]
name = "terlan-http-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
instant-acme = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http-body-util.workspace = true
bytes.workspace = true
basic-toml = "0.1.10"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls-webpki = "0.103.13"
rcgen.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
cookie = "0.18.1"
http.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
httparse.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
tungstenite.workspace = true
terlan-data-native = { path = "../../data/native" }
terlan-net-native = { path = "../../net/native" }
time = { workspace = true, features = ["formatting", "parsing"] }
terlan-runtime-abi.workspace = true
tempfile.workspace = true

[dev-dependencies]
instant-acme.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
serde_json.workspace = true

[features]
acme-issuer = ["dep:instant-acme"]
