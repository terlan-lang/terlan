production_decision_function = "self_host.ProductionAuthority.evaluate"
fallback_remains_available_for_one_release = true
rust_frontend_deletion_requires_follow_up_release = true

[dynamic_call_target_authority]
required = true
owner = "compiler/self_host/src/self_host/SelfHostActorDynamicDiscovery.terl"
requirements = [
    "every Core call-value has a finite target set or compilation fails closed",
    "closure targets propagate through move, phi, select, and local-call parameters",
    "dynamic targets participate in actor effect and suspension-profile convergence",
    "opaque and imported higher-order values require explicit compile evidence",
]

